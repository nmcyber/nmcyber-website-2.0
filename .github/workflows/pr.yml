name: Pull Request

on: [pull_request]

jobs:
  frontend-lint:
    name: ⚡ Frontend Biome
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: 📥 Install dependencies
        run: bun install

      - name: 🔬 Run Biome check
        run: bun run check

  frontend-type-check:
    name: ʦ Frontend TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: 📥 Install dependencies
        run: bun install

      - name: 🔎 Type check
        run: bun run type-check

  backend-type-check:
    name: ʦ Backend TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    env:
      # Dummy DATABASE_URL for Prisma schema validation (not used for actual DB connection)
      DATABASE_URL: postgresql://user:password@localhost:5432/nmcyber_ci?schema=public
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: 📥 Install backend dependencies
        run: bun install

      - name: 🔮 Generate Prisma Client
        run: bun run prisma:generate

      - name: 🔎 Type check backend
        run: bun run type-check