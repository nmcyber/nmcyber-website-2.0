name: Code Quality

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  quality:
    name: Lint, Format & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Biome check — no auto-fix, exits non-zero on any violation.
      # Use `bun run fix` locally to auto-fix before pushing.
      - name: Biome check
        run: bun run check

      - name: TypeScript type check
        run: bun run type-check
